<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Incredibles | Pages 70–72</title><style>
:root{
  --bg:#ece7f1;
  --bg-panel:#f6f3f7;
  --surface:#fbf9f6;
  --surface-alt:#efe8ec;
  --ink:#372f45;
  --ink-soft:#6c6178;
  --ink-faint:#948a9e;
  --rose:#c99fa3;
  --rose-deep:#b47f85;
  --sage:#95a98d;
  --sage-deep:#748a6c;
  --gold:#cbae72;
  --gold-deep:#a98a4c;
  --lavender:#8f7fae;
  --lavender-deep:#6f5e91;
  --border:#dcd3e0;
  --ok:#5f8a5a;
  --bad:#b15b57;
  --radius:14px;
  --shadow:0 1px 2px rgba(55,47,69,0.06), 0 6px 18px rgba(55,47,69,0.07);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:16px;
  line-height:1.55;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:600;
  color:var(--ink);
  margin:0 0 0.4em;
}
p{margin:0 0 0.9em;}
.app{max-width:1180px;margin:0 auto;padding:22px 18px 60px;}

/* ---------- HEADER ---------- */
.masthead{
  display:flex;
  align-items:center;
  gap:22px;
  background:linear-gradient(135deg,var(--lavender) 0%, var(--rose-deep) 100%);
  color:#fbf7f9;
  border-radius:18px;
  padding:26px 28px;
  box-shadow:var(--shadow);
}
.masthead svg{flex:0 0 auto;width:64px;height:64px;}
.masthead h1{color:#fff;font-size:1.7rem;margin-bottom:4px;}
.masthead p{color:#efe6ee;margin:0;font-size:0.98rem;max-width:640px;}

/* ---------- TEACHER NOTE ---------- */
.teacher-note{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:5px solid var(--gold-deep);
  border-radius:var(--radius);
  padding:16px 20px;
  margin-top:18px;
}
.teacher-note summary{
  cursor:pointer;
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.05rem;
  color:var(--ink);
}
.teacher-note[open] summary{margin-bottom:10px;}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
.plan-col{background:var(--surface-alt);border-radius:10px;padding:12px 14px;}
.plan-col h4{font-size:0.95rem;color:var(--lavender-deep);}
.plan-col ol{margin:0;padding-left:1.2em;font-size:0.92rem;color:var(--ink-soft);}
.plan-col li{margin-bottom:4px;}
@media(max-width:700px){.plan-grid{grid-template-columns:1fr;}}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;gap:22px;margin-top:22px;align-items:start;}
@media(max-width:880px){.layout{grid-template-columns:1fr;}}

.rail{
  position:sticky;top:16px;
  display:flex;flex-direction:column;gap:16px;
}
@media(max-width:880px){.rail{position:static;flex-direction:row;overflow-x:auto;gap:12px;padding-bottom:4px;}}

.level-group{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px;
  box-shadow:var(--shadow);
}
@media(max-width:880px){.level-group{min-width:220px;flex:0 0 auto;}}

.level-label{
  font-family:'Fraunces',serif;
  font-size:0.78rem;
  letter-spacing:0.02em;
  color:var(--ink-faint);
  margin:2px 0 8px 4px;
}
.level-label .lvl-word{color:inherit;font-style:italic;}
.tab-btn{
  display:flex;align-items:center;gap:9px;
  width:100%;text-align:left;
  border:none;background:transparent;
  padding:9px 10px;border-radius:9px;
  font-family:'Inter',sans-serif;font-size:0.93rem;font-weight:500;
  color:var(--ink-soft);cursor:pointer;
  margin-bottom:2px;
}
.tab-btn:hover{background:var(--surface-alt);}
.tab-btn.active{background:var(--lavender);color:#fff;}
.tab-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;}
.tab-btn.active .tab-dot{background:#fff;}

/* text level = rose accent, word level = gold, sentence level = sage */
.level-group[data-lvl="text"] .tab-btn.active{background:var(--rose-deep);}
.level-group[data-lvl="word"] .tab-btn.active{background:var(--gold-deep);}
.level-group[data-lvl="sentence"] .tab-btn.active{background:var(--sage-deep);}

/* ---------- PANELS ---------- */
main{min-width:0;}
.panel{
  display:none;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px 26px;
  box-shadow:var(--shadow);
}
.panel.active{display:block;}
.panel-head{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:14px;}
.panel-head h2{font-size:1.4rem;}
.panel-head .kicker{font-size:0.82rem;color:var(--ink-faint);font-style:italic;}
.instructions{
  background:var(--surface-alt);
  border-radius:10px;
  padding:12px 16px;
  font-size:0.92rem;
  color:var(--ink-soft);
  margin-bottom:18px;
}
.instructions strong{color:var(--ink);}

/* ---------- AUDIO ---------- */
.audio-bar{
  background:var(--surface-alt);border-radius:10px;
  padding:12px 14px;margin-bottom:18px;font-size:0.88rem;color:var(--ink-soft);
}
.audio-row{display:flex;align-items:center;gap:10px;}
.audio-row + .audio-row{margin-top:8px;}
.audio-bar .btn{background:var(--sage-deep);}
.audio-bar .btn:disabled{background:var(--ink-faint);cursor:not-allowed;opacity:0.6;}
.audio-icon-btn{padding:8px 12px;font-size:0.8rem;}
.audio-seek-row{gap:10px;}
#audio-seek{flex:1;accent-color:var(--sage-deep);cursor:pointer;}
#audio-seek:disabled{cursor:not-allowed;opacity:0.5;}
.audio-time{font-variant-numeric:tabular-nums;font-size:0.8rem;color:var(--ink-faint);min-width:38px;text-align:center;}

/* ---------- EXTRACT ---------- */
.extract-hero-img{
  width:100%;max-width:100%;height:auto;display:block;
  border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);margin-bottom:18px;
}
.extract{
  font-family:'Fraunces',serif;
  font-size:1.04rem;
  line-height:1.75;
  color:var(--ink);
  max-width:74ch;
}
.extract .byline{text-align:right;font-style:italic;color:var(--ink-soft);margin-top:16px;}
.extract p{margin-bottom:1em;}
.dropcap:first-letter{
  font-family:'Fraunces',serif;
  font-size:3.1em;font-weight:700;
  float:left;line-height:0.85;
  padding-right:8px;padding-top:4px;
  color:var(--rose-deep);
}

/* ---------- COMPREHENSION ---------- */
.q-nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:16px;}
.q-nav-label{
  font-family:'Fraunces',serif;font-weight:700;font-size:0.78rem;
  color:var(--ink-faint);margin:0 4px 0 10px;
}
.q-nav-label:first-child{margin-left:0;}
.q-pill{
  border:1.5px solid var(--border);background:var(--surface-alt);
  color:var(--ink-soft);font-family:'Inter',sans-serif;font-weight:600;font-size:0.82rem;
  padding:6px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto;
}
.q-pill:hover{border-color:var(--lavender);}
.q-pill.active{background:var(--lavender);border-color:var(--lavender-deep);color:#fff;}
.q-pill.active.grp-B{background:var(--rose-deep);border-color:var(--rose-deep);}

.q-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.q-banner{
  padding:10px 18px;font-size:0.8rem;font-weight:600;
  background:var(--lavender);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.q-banner.grp-B{background:var(--rose-deep);}
.q-badge{
  display:inline-block;padding:3px 11px;border-radius:999px;
  font-size:0.72rem;font-weight:700;background:rgba(255,255,255,0.25);color:#fff;
}
.q-tabs2{display:flex;border-bottom:1px solid var(--border);}
.q-tab2{
  flex:1;padding:10px 14px;font-size:0.86rem;cursor:pointer;
  color:var(--ink-soft);background:var(--surface-alt);border:none;border-bottom:2px solid transparent;
  text-align:center;font-family:'Inter',sans-serif;font-weight:500;
}
.q-tab2:first-child{border-right:1px solid var(--border);}
.q-tab2.active{background:var(--surface);color:var(--ink);font-weight:700;border-bottom:2px solid var(--lavender);}
.q-body{padding:18px 20px;}
.q-sublabel{
  font-size:0.72rem;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:6px;
}
.q-divider{height:1px;background:var(--border);margin:16px 0;}
.question-restated{font-family:'Fraunces',serif;font-size:1.08rem;margin-bottom:6px;}
.circle-word{
  border:2px solid var(--rose-deep);border-radius:999px;
  padding:1px 10px;font-weight:700;color:var(--rose-deep);
}
.underline-focus{
  border-bottom:3px solid var(--sage-deep);font-weight:600;
}
.excerpt-block{
  font-family:'Fraunces',serif;font-style:italic;
  background:var(--surface-alt);border-left:4px solid var(--gold-deep);
  padding:12px 16px;border-radius:0 6px 6px 0;color:var(--ink-soft);
}
.evidence-highlight{
  color:var(--ink);font-style:normal;font-weight:700;
  text-decoration:underline;text-decoration-color:var(--gold-deep);
  text-decoration-thickness:3px;text-underline-offset:3px;
}
.model-answer{background:var(--surface-alt);border-radius:8px;padding:14px 16px;}
.model-answer .tag{
  display:inline-block;font-size:0.74rem;font-weight:700;
  background:var(--rose);color:#fff;padding:2px 9px;border-radius:999px;
  margin-bottom:10px;letter-spacing:0.02em;
}
.model-answer .explain{color:var(--ink-soft);font-size:0.92rem;margin-top:8px;}

/* ---------- MATCH GAMES ---------- */
.match-game{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
@media(max-width:700px){.match-game{grid-template-columns:1fr;}}
.match-col h4{font-size:0.85rem;color:var(--ink-faint);margin-bottom:8px;}
.match-item{
  border:1.5px solid var(--border);border-radius:10px;
  padding:10px 14px;margin-bottom:8px;cursor:pointer;
  background:var(--surface-alt);font-size:0.94rem;transition:background .15s,border-color .15s;
  display:flex;align-items:center;
}
.match-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  color:#fff;font-size:0.72rem;font-weight:700;
  margin-right:10px;flex:0 0 auto;
}
.match-item.picked{border-color:var(--lavender);background:#e6def0;}
.match-item.correct{border-color:var(--ok);background:#e2ecdf;color:var(--ok);cursor:default;}
.match-item.wrong-flash{border-color:var(--bad);background:#f3e0df;}
.match-status{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  margin-bottom:14px;font-size:0.9rem;color:var(--ink-soft);
}
.match-status .btn{margin-left:8px;}
.match-status .btn:first-child{margin-left:0;}
.btn{
  border:none;background:var(--lavender);color:#fff;
  padding:8px 16px;border-radius:8px;font-weight:600;font-size:0.86rem;
  cursor:pointer;font-family:'Inter',sans-serif;
}
.btn.secondary{background:transparent;border:1.5px solid var(--border);color:var(--ink-soft);}
.btn:hover{opacity:0.92;}

/* ---------- FUN FACTS TIMELINE ---------- */
.timeline{position:relative;padding-left:6px;margin-top:10px;}
.timeline::before{
  content:"";position:absolute;left:27px;top:8px;bottom:8px;width:3px;
  background:linear-gradient(var(--rose),var(--gold),var(--sage),var(--lavender));
  border-radius:3px;
}
.tl-item{position:relative;padding:0 0 26px 62px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{
  position:absolute;left:16px;top:2px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);border:3px solid var(--lavender);
}
.tl-item:nth-child(1) .tl-dot{border-color:var(--rose-deep);}
.tl-item:nth-child(2) .tl-dot{border-color:var(--gold-deep);}
.tl-item:nth-child(3) .tl-dot{border-color:var(--sage-deep);}
.tl-item:nth-child(4) .tl-dot{border-color:var(--lavender-deep);}
.tl-card{background:var(--surface-alt);border-radius:10px;padding:12px 16px;}
.tl-card h4{font-size:1rem;margin-bottom:4px;}
.tl-card .when{font-size:0.78rem;color:var(--ink-faint);font-weight:600;}
.tl-card p{margin:6px 0 0;font-size:0.9rem;color:var(--ink-soft);}

/* ---------- NOUN SORT ---------- */
.noun-table{width:100%;border-collapse:collapse;}
.noun-table td,.noun-table th{padding:8px 6px;border-bottom:1px solid var(--border);font-size:0.9rem;text-align:left;}
.noun-table th{color:var(--ink-faint);font-weight:600;font-size:0.78rem;}
.noun-word{font-family:'Fraunces',serif;font-weight:600;}
.cat-btn-row{display:flex;gap:5px;flex-wrap:wrap;}
.cat-btn{
  border:1.5px solid var(--border);background:var(--surface);
  padding:5px 10px;border-radius:7px;font-size:0.78rem;cursor:pointer;color:var(--ink-soft);
}
.cat-btn.chosen{background:var(--lavender);border-color:var(--lavender-deep);color:#fff;}
.cat-btn.chosen.right{background:var(--ok);border-color:var(--ok);}
.cat-btn.chosen.wrong{background:var(--bad);border-color:var(--bad);}
.noun-feedback{font-size:0.8rem;color:var(--ink-faint);margin-top:3px;}

/* ---------- ADJECTIVE FILL ---------- */
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;padding:14px;background:var(--surface-alt);border-radius:10px;}
.bank-word{
  border:1.5px solid var(--gold-deep);background:var(--surface);color:var(--ink);
  padding:6px 13px;border-radius:999px;font-size:0.88rem;cursor:grab;font-weight:600;
}
.bank-word.used{opacity:0.35;cursor:not-allowed;}
.bank-word.selected{background:var(--gold);color:#fff;}
.fill-sentence{margin-bottom:12px;font-size:0.96rem;line-height:1.9;}
.blank{
  display:inline-block;min-width:110px;text-align:center;
  border-bottom:2.5px solid var(--sage-deep);padding:2px 8px;
  font-weight:700;color:var(--sage-deep);cursor:pointer;background:var(--surface-alt);
  border-radius:4px 4px 0 0;
}
.blank.filled{color:var(--ink);background:transparent;}
.blank.correct{color:var(--ok);border-color:var(--ok);}
.blank.wrong{color:var(--bad);border-color:var(--bad);}

/* ---------- PRECISE WORD TABLE ---------- */
.sense-table{width:100%;border-collapse:collapse;font-size:0.86rem;}
.sense-table th,.sense-table td{border:1px solid var(--border);padding:7px 6px;text-align:center;}
.sense-table th{background:var(--surface-alt);font-weight:600;color:var(--ink-soft);}
.sense-table td:first-child{text-align:left;font-family:'Fraunces',serif;font-weight:600;}
.sense-table input[type="checkbox"]{width:16px;height:16px;accent-color:var(--lavender);}
.sense-suggested{display:none;}
.sense-suggested.show{display:table-row;}
.other-note{font-size:0.78rem;color:var(--ink-faint);}

.footer-note{
  margin-top:24px;font-size:0.82rem;color:var(--ink-faint);
  border-top:1px solid var(--border);padding-top:14px;
}

</style></head><body><div class="app"><header class="masthead"><div><h1>The Incredibles</h1><p>3.4 Reviewing films · Pages 70–72</p><p>Read the review. Find evidence. Explore vocabulary and structure.</p></div></header><div class="layout"><nav class="rail" aria-label="Guide sections"><div class="level-group" data-lvl="text"><div class="level-label">Text level</div><div class="tabs"><button class="tab-btn" data-panel="extract"><span class="tab-dot"></span>The review</button><button class="tab-btn" data-panel="starter"><span class="tab-dot"></span>Getting started</button><button class="tab-btn" data-panel="questions"><span class="tab-dot"></span>Comprehension 1a–c</button></div></div><div class="level-group" data-lvl="word"><div class="level-label">Word level</div><div class="tabs"><button class="tab-btn" data-panel="vocab"><span class="tab-dot"></span>Vocabulary match</button><button class="tab-btn" data-panel="language"><span class="tab-dot"></span>Q2 · Film language</button></div></div><div class="level-group" data-lvl="sentence"><div class="level-label">Text structure</div><div class="tabs"><button class="tab-btn" data-panel="structure"><span class="tab-dot"></span>Q3 · Label the review</button></div></div></nav><main id="main"><section class="panel" id="extract" aria-label="The review"></section><section class="panel" id="starter" aria-label="Getting started"></section><section class="panel" id="questions" aria-label="Comprehension 1a–c"></section><section class="panel" id="vocab" aria-label="Vocabulary match"></section><section class="panel" id="language" aria-label="Q2 · Film language"></section><section class="panel" id="structure" aria-label="Q3 · Label the review"></section></main></div><footer class="small" style="margin-top:24px">Source: supplied Cambridge University Press material © 2021, pages 70–72. Model answers follow the supplied Lesson 3.4 answer key.</footer></div><script>const P=["The Incredibles is an incredibly funny and incredibly warm comedy that made me laugh like a horse. In fact, I laughed so hard, I sometimes felt my ribs would explode. Like the pixelated characters in the film, I felt I\u2019d been flung through walls, thrown into the ocean and hurled headlong into the sky. The film puts lots of different ideas in the blender \u2013 it felt like a mixture of X-Men and Batman but very modern at the same time. Pixar have taken earlier films and turned them into something altogether new.", "The story begins in the late 1940s and features Mr Incredible (voiced by Craig T. Nelson) and his fianc\u00e9e, Elastigirl (voiced by Holly Hunter). Elastigirl has the incredible ability to stretch in every direction. The couple use their skills to defeat robbers and help citizens. But pretty soon, their activities are halted when lawyers and money-seeking survivors take Mr Incredible to court. In short, the fantastic duo have to move to another city.", "The story takes a turn when 15 years later, a larger and balding Mr Incredible is offered the opportunity to work again as a superhero. The temptation is great, but the man behind this offer remains a mystery: does he really want Mr Incredible to return \u2013 or is he a former enemy trying to destroy the former superhero?", "The animation and accompanying soundtrack are mind-blowing. These are just two of the standout features of this film, but it\u2019s the humour that wins the viewer over. It\u2019s not just the main characters who entertain, but the hilarious, bespectacled Edna Mode \u2013 the designer of superhero costumes who reworks Mr Incredible\u2019s outfit. The lines given to her are some of the best in the film.", "Superhero films are nothing new, but this one feels fresh. If you\u2019re looking for the classic holiday film which provides fun for all the family, search no further, The Incredibles is incredible comedy."];const Q=[{"id": "1a", "q": "Which genre of film is The Incredibles: action, adventure, comedy, family, superhero, romance? (You might choose more than one.)", "command": "Which", "focus": "genre of film", "hint": "A genre is a type of film. Look for words about humour, superheroes and the audience.", "format": "Name the genres in one complete sentence.", "answer": "The Incredibles belongs to the comedy, family and superhero genres. Action and adventure are also acceptable.", "explain": "\u201cComedy\u201d tells us it is funny. \u201cSuperhero\u201d tells us what kind of characters it has. \u201cFun for all the family\u201d tells us its audience.", "evidence": ["comedy", "Superhero films", "fun for all the family"]}, {"id": "1b", "q": "Name one other film that the reviewer suggests has influenced The Incredibles.", "command": "Name", "focus": "one other film", "hint": "Look in the first paragraph for two film titles. You only need one.", "format": "Write one complete sentence. Give one film title.", "answer": "The reviewer suggests that X-Men has influenced The Incredibles.", "explain": "Batman is also correct. Choose either title; the question asks for one film.", "evidence": ["X-Men", "Batman"]}, {"id": "1c", "q": "Is the reviewer\u2019s opinion of the film positive or negative? Give two quotations to support your answer.", "command": "Give", "focus": "two quotations", "hint": "Decide whether she likes the film. Then copy two phrases that show her opinion.", "format": "State the opinion in a complete sentence and include two exact quotations in quotation marks.", "answer": "The reviewer\u2019s opinion is positive. She calls the film \u201can incredibly funny and incredibly warm comedy\u201d and says \u201cthis one feels fresh\u201d.", "explain": "Positive means she likes it. \u201cFunny\u201d praises its humour and \u201cfresh\u201d suggests it feels new. Other quotations that clearly praise the film are also acceptable.", "evidence": ["an incredibly funny and incredibly warm comedy", "this one feels fresh", "it\u2019s the humour that wins the viewer over", "The Incredibles is incredible comedy"]}];const V=[["pixelated", "computer-generated"], ["headlong", "quickly and suddenly"], ["soundtrack", "the music in a film or TV show"], ["bespectacled", "wearing glasses"], ["fact", "something that is known to have happened or exist"], ["plot", "the main events of a story, film, novel or play in sequence from beginning to end"], ["backstory", "the fictional history or background created for a character in a story or film"]];const S=[["Title", "The film title.", "The Incredibles \u2013 absolutely incredible!", "The heading names the film. \u201cAbsolutely incredible!\u201d also gives a positive verdict."], ["Cast/actors", "Leading actors or the people who provide voices in an animation.", "Craig T. Nelson / Holly Hunter", "These are the actors\u2019 names. Mr Incredible and Elastigirl are the characters."], ["Official film rating", "The judgement made about suitable audiences for the film, often an age rating.", "Cert: U", "This is the official certificate shown above the review. It is different from the reviewer\u2019s personal opinion."], ["Reviewer\u2019s verdict", "The reviewer\u2019s decision about whether the film is good or bad.", "The Incredibles is incredible comedy.", "The closing words praise the film. The title and opening paragraph also show the verdict. This review does not use stars or a grade."], ["Plot", "Information about the story\u2019s events, setting and key characters.", "Mr Incredible is offered the opportunity to work again as a superhero.", "This tells us what happens in the story. The review raises a question about the offer without giving away the ending."], ["Backstory", "Background events that happen before the main action.", "The heroes help citizens, are taken to court and move to another city.", "Paragraph 2 gives the earlier events. Paragraph 3 then moves forward 15 years. Backstory is also part of the wider plot."]];const IMG="data:image/jpeg;base64,/9j/7gAOQWRvYmUAZAAAAAAA/9sAQwACAQEBAQECAQEBAgICAgIEAwICAgIFBAQDBAYFBgYGBQYGBgcJCAYHC let saved={};try{saved=JSON.parse(localStorage.getItem('incredibles7072')||'{}')}catch(e){}

function highlight(t,phrases=[]){let out=esc(t);[...phrases].sort((a,b)=>b.length-a.length).forEach(x=>{out=out.split(esc(x)).join('<mark>'+esc(x)+'</mark>')});return out}
function review(phrases=[],picture=false){return '<article class="extract"><span class="page-tag">PAGE 70</span><h3>'+highlight('The Incredibles – absolutely incredible!',phrases)+'</h3><p class="byline">Reviewed by Jenny Hampster</p><p>'+highlight('Cert: U',phrases)+'</p>'+P.map((p,i)=>(i===1?'<span class="page-tag">PAGE 71</span>':'')+'<p>'+highlight(p,phrases)+'</p>'+(i===1&&picture?'<img class="review-img" src="'+IMG+'" alt="The Incredibles characters, from the supplied page 71">':'')).join('')+'</article>'}
function heading(k,t){return '<div class="panel-head"><div class="kicker">'+k+'</div><h2>'+t+'</h2></div>'}
function note(t){return '<div class="instructions">'+t+'</div>'}
function btn(t,action,secondary=false){return '<button class="btn'+(secondary?' secondary':'')+'" '+action+'>'+t+'</button>'}
function field(k,label){return '<label for="'+k+'">'+label+'</label><textarea id="'+k+'" data-save="'+k+'">'+esc(saved[k]||'')+'</textarea>'}
function model(text,why=''){return '<div class="model-answer"><strong>Model answer</strong><p>'+text+'</p>'+(why?'<p class="explain">'+why+'</p>':'')+'</div>'}
function toggle(id,button){const e=document.getElementById(id);e.hidden=!e.hidden;button.setAttribute('aria-expanded',String(!e.hidden));}
function status(id){return '<div class="controls">'+btn('✓ Secure','data-status="'+id+'" data-value="✓ Secure"',true)+btn('△ Revisit','data-status="'+id+'" data-value="△ Revisit"',true)+'</div><div class="status" id="status-'+id+'" aria-live="polite">'+(saved['status-'+id]||'')+'</div>'}

$('#starter').innerHTML=heading('Page 70','Getting started')+note('In small groups, list as many superhero films as you can in three minutes. Share ideas with the class, then discuss the typical features of this genre. What themes and ideas do superhero films often have in common (e.g. a dramatic rescue, a happy ending).')+'<div class="timer" id="time">3:00</div><div class="controls">'+btn('Start / pause','id="timer-start"')+btn('Reset timer','id="timer-reset"',true)+'</div>'+field('starter-films','Our superhero films')+field('starter-features','What do superhero films often have in common?')+btn('Reveal model answer','data-toggle="starter-model" aria-expanded="false"')+'<div id="starter-model" hidden>'+model('Examples of films: The Incredibles, X-Men and Batman.<br>Superhero films often show a hero helping people or stopping an enemy. They may include a dramatic rescue and a happy ending.','Your film list and ideas may be different. These are examples, not the only correct answers.')+'</div>';
let seconds=180,timer=null;function time(){ $('#time').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0') }$('#timer-start').onclick=()=>{if(timer){clearInterval(timer);timer=null}else if(seconds){timer=setInterval(()=>{seconds--;time();if(!seconds){clearInterval(timer);timer=null}},1000)}};$('#timer-reset').onclick=()=>{clearInterval(timer);timer=null;seconds=180;time()};
